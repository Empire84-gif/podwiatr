{% extends "base.html" %}

{% block content %}

<section class="login-page">

  <div class="login-card">

    <div class="login-brand">
      Pod Wiatr
    </div>

    <p class="login-subtitle">
      Zresetuj hasło do panelu
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="login-alerts">
          {% for category, message in messages %}
            <div class="login-alert login-alert-{{ category }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form
      method="POST"
      action="{{ url_for('forgot_password') }}"
      class="login-form"
    >

      <div class="login-field">
        <label for="email">Email konta</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="jan@example.com"
          required
        >
      </div>

      <button type="submit" class="login-submit">
        <i class="bi bi-envelope"></i>
        Przygotuj link resetujący
      </button>

    </form>

    <a
      href="{{ url_for('login') }}"
      class="login-secondary-link"
    >
      Wróć do logowania
    </a>

  </div>

</section>

{% endblock %}
