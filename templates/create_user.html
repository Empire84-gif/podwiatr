{% extends "base.html" %}

{% block content %}

<section class="login-page">

  <div class="login-card">

    <div class="login-brand">
      Pod Wiatr
    </div>

    <p class="login-subtitle">
      Dodaj użytkownika i wygeneruj link aktywacyjny
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="login-alerts">
          {% for category, message in messages %}
            <div class="login-alert login-alert-{{ category }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('create_user') }}" class="login-form">

      <div class="login-field">
        <label for="full_name">Imię i nazwisko</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          placeholder="Jan Kowalski"
          required
        >
      </div>

      <div class="login-field">
        <label for="email">Email użytkownika</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="jan@example.com"
          required
        >
      </div>

      <button type="submit" class="login-submit">
        <i class="bi bi-person-plus"></i>
        Utwórz użytkownika
      </button>

    </form>

  </div>

</section>

{% endblock %}
